<section class="services" id="services">
  <div class="container">

    <div class="section-header">
      <span class="section-label">// services</span>
      <h2>Ce que je <span class="grad">construis</span> pour vous</h2>
      <p class="sub">Des solutions complètes, de la maquette à la mise en production.</p>
    </div>

    <div class="services-grid">
      <article class="svc-card glass" *ngFor="let s of services; let i = index">
        <div class="svc-top">
          <div class="svc-icon">
            <i [class]="s.icon"></i>
          </div>
          <span class="svc-num">{{ (i+1).toString().padStart(2,'0') }}</span>
        </div>
        <h3>{{ s.title }}</h3>
        <p class="svc-desc">{{ s.desc }}</p>
        <ul class="svc-features">
          <li *ngFor="let f of s.features">
            <i class="fa-solid fa-check"></i><span>{{ f }}</span>
          </li>
        </ul>
        <div class="svc-stack">
          <span *ngFor="let t of s.technologies">{{ t }}</span>
        </div>
      </article>
    </div>

    <!-- Process -->
    <div class="process">
      <h3>Comment je travaille</h3>
      <div class="process-steps">
        <div class="ps-item" *ngFor="let step of process; let i = index">
          <div class="ps-num">{{ i + 1 }}</div>
          <div class="ps-line"></div>
          <h4>{{ step.title }}</h4>
          <p>{{ step.desc }}</p>
        </div>
      </div>
    </div>

  </div>
</section>
