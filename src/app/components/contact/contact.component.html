<section class="contact" id="contact">
  <div class="container">

    <div class="contact-grid">
      <!-- Texte -->
      <div class="contact-text">
        <span class="section-label">// contact</span>
        <h2>Un projet ? <span class="grad">Parlons-en.</span></h2>
        <p>
          Décrivez votre idée, votre besoin ou votre projet.
          Je vous réponds rapidement avec une proposition concrète.
        </p>

        <div class="contact-info">
          <div class="info-item">
            <i class="fa-solid fa-envelope"></i>
            <span>Disponible par email</span>
          </div>
          <div class="info-item">
            <i class="fa-brands fa-github"></i>
            <a href="https://github.com/aqet" target="_blank" rel="noopener">github.com/aqet</a>
          </div>
          <div class="info-item">
            <i class="fa-solid fa-location-dot"></i>
            <span>Cameroun / Remote</span>
          </div>
        </div>
      </div>

      <!-- Formulaire -->
      <form class="contact-form glass" (ngSubmit)="submitForm()" #contactForm="ngForm">
        <div class="field">
          <label for="c-name">Nom</label>
          <input
            id="c-name"
            type="text"
            name="name"
            [(ngModel)]="form.name"
            placeholder="Votre nom"
            required
          />
        </div>

        <div class="field">
          <label for="c-email">Email</label>
          <input
            id="c-email"
            type="email"
            name="email"
            [(ngModel)]="form.email"
            placeholder="votre@email.com"
            required
          />
        </div>

        <div class="field">
          <label for="c-msg">Message</label>
          <textarea
            id="c-msg"
            name="message"
            [(ngModel)]="form.message"
            rows="5"
            placeholder="Décrivez votre projet..."
            required
          ></textarea>
        </div>

        <button type="submit" [disabled]="isSubmitting">
          <span>{{ isSubmitting ? 'Envoi en cours...' : 'Envoyer le message' }}</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>

        <p class="success-msg" *ngIf="submitted">
          <i class="fa-solid fa-circle-check"></i>
          Merci ! Je vous réponds très vite.
        </p>
      </form>
    </div>

  </div>
</section>
